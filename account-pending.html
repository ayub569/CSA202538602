<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Pending | Umar International High School</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="account-pending">
    <main class="portal auth-page">
        <section class="school-panel" aria-label="Umar International High School">
            <img class="school-image" src="school-login.png" alt="Umar International High School campus">
            <div class="school-caption">
                <p class="eyebrow">LEARN · GROW · EXCEL</p>
                <h1>Account pending</h1>
                <p>Your portal access is waiting for administrative approval.</p>
            </div>
        </section>
        <section class="login-panel">
            <div class="login-content auth-card">
                <div class="school-mark" aria-hidden="true">UI</div>
                <p class="eyebrow">UMAR INTERNATIONAL HIGH SCHOOL</p>
                <p class="school-address">STATUS</p>
                <h2>Approval in progress</h2>
                <p class="login-description" id="status-message">Your account is pending approval. Please try again later.</p>
                <p class="login-help"><a href="index.html">Back to login</a></p>
            </div>
            <footer class="page-footer">&copy; 2026 Umar International High School</footer>
        </section>
    </main>
    <script src="auth-pages.js"></script>
</body>
</html>
